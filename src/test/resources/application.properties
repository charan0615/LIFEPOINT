spring.application.name=LifePoint-Test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.google.client-id=lifepoint-unconfigured-client-id
spring.security.oauth2.client.registration.google.client-secret=lifepoint-unconfigured-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
