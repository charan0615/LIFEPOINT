spring.application.name=LifePoint
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/lifepoint;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Google OAuth 2.0 Credentials
# Loaded dynamically from environment variables GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
# In Google Cloud Console, configure Authorized redirect URIs:
#   http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:lifepoint-unconfigured-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:lifepoint-unconfigured-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
